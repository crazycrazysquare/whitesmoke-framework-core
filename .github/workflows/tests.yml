name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; the comment names the release.
# PHPUnit 11 runs with --fail-on-*: deprecations, warnings, notices and risky tests fail the build.

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  mysql:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        db: ['mysql:8.4', 'mariadb:11.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: whitesmoke_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret --silent || mariadb-admin ping -h 127.0.0.1 -psecret --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: whitesmoke_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  pgsql:
    name: PHP ${{ matrix.php }} · postgres:17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: whitesmoke_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: whitesmoke_test
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  sqlsrv:
    name: PHP ${{ matrix.php }} · sqlserver:2022
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: WsCi2026Pass
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P WsCi2026Pass -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: sqlsrv
      DB_HOST: 127.0.0.1
      DB_PORT: 1433
      DB_DATABASE: whitesmoke_test
      DB_USERNAME: sa
      DB_PASSWORD: WsCi2026Pass
      DB_TRUST_SERVER_CERTIFICATE: 'true'   # the container's certificate is self-signed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlsrv, pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - name: Create the test database
        run: docker exec ${{ job.services.db.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P WsCi2026Pass -b -Q "CREATE DATABASE whitesmoke_test"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  phpunit:
    name: PHPUnit ${{ matrix.phpunit }} · PHP 8.3 · SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phpunit: ['9.6.*', '10.5.*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml
