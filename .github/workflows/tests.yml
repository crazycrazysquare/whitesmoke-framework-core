name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; the comment names the release.
# PHPUnit 11 runs with --fail-on-*: deprecations, warnings, notices and risky tests fail the build.

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: Test on in-memory SQLite
        run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Test on a SQLite file (runs the simultaneous-login test too)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/whitesmoke-test.sqlite
        run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit-file.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml build/junit-file.xml

  # SQLite before 3.35 has no RETURNING, so the throttle uses its BEGIN IMMEDIATE
  # fallback. Debian 11's PHP image ships SQLite 3.34.1 (pinned by digest).
  sqlite-old:
    name: PHP 8.3 · SQLite 3.34 · Debian 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: php@sha256:ce8ad0e306131c2fa3fe613aa167c360176d77a2b2411c33132687259da9b3d8 # php:8.3-cli-bullseye
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: Check that the image still has SQLite older than 3.35
        run: |
          docker run --rm "$IMAGE" php -r '$v = (new PDO("sqlite::memory:"))->query("SELECT sqlite_version()")->fetchColumn(); echo "SQLite $v\n"; exit(version_compare($v, "3.35.0", "<") ? 0 : 1);'
      - name: Test on in-memory SQLite
        run: docker run --rm -v "$PWD:/app" -w /app "$IMAGE" php -d error_reporting=-1 vendor/bin/phpunit --stderr --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Test on a SQLite file (runs the simultaneous-login test too)
        run: docker run --rm -v "$PWD:/app" -w /app -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/whitesmoke-test.sqlite "$IMAGE" php -d error_reporting=-1 vendor/bin/phpunit --stderr --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit-file.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml build/junit-file.xml

  mysql:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        db: ['mysql:8.4', 'mariadb:11.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: whitesmoke_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret --silent || mariadb-admin ping -h 127.0.0.1 -psecret --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: whitesmoke_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  pgsql:
    name: PHP ${{ matrix.php }} · postgres:17 · redis:7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: whitesmoke_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: whitesmoke_test
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      REDIS_TEST_PORT: 6379
      REDIS_TEST_PASSWORD: test-redis-pw
      REDIS_TEST_USERNAME: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      # Service containers take no arguments, so the password is set here.
      - name: Set the Redis password
        run: docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass "$REDIS_TEST_PASSWORD"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  sqlsrv:
    name: PHP ${{ matrix.php }} · sqlserver:2022
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: WsCi2026Pass
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P WsCi2026Pass -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: sqlsrv
      DB_HOST: 127.0.0.1
      DB_PORT: 1433
      DB_DATABASE: whitesmoke_test
      DB_USERNAME: sa
      DB_PASSWORD: WsCi2026Pass
      DB_TRUST_SERVER_CERTIFICATE: 'true'   # the container's certificate is self-signed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlsrv, pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      # pdo_sqlsrv needs Microsoft's ODBC driver, which the runner image no longer ships.
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          . /etc/os-release
          sudo apt-get update -qq
          if ! apt-cache show msodbcsql18 > /dev/null 2>&1; then
            curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -qq
          fi
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18
      - name: Create the test database
        run: docker exec ${{ job.services.db.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P WsCi2026Pass -b -Q "CREATE DATABASE whitesmoke_test"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --fail-on-deprecation --fail-on-warning --fail-on-notice --fail-on-risky --display-deprecations --display-warnings --display-notices --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml

  phpunit:
    name: PHPUnit ${{ matrix.phpunit }} · PHP 8.3 · SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phpunit: ['9.6.*', '10.5.*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo
          ini-values: error_reporting=-1
          coverage: none
      - run: composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test -- --log-junit build/junit.xml
      - name: Show failing tests as annotations
        if: failure()
        run: php .github/junit-annotations.php build/junit.xml
